AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Satang local SAM template (HTTP API -> Lambda -> DynamoDB Local)

Parameters:
  TableName:
    Type: String
    Default: satang-dynamodb
  DynamoDbEndpoint:
    Type: String
    Default: http://host.docker.internal:8000

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 128
    Environment:
      Variables:
        ENVIRONMENT: local
        TABLE_NAME: !Ref TableName
        AWS_DYNAMODB_ENDPOINT: !Ref DynamoDbEndpoint

Resources:
  SatangLocalHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: local

  CreateTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/transaction/create_transaction
      Handler: bootstrap
      Events:
        CreateTransactionApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/transactions
            Method: POST

  ListTransactionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/transaction/list_transactions
      Handler: bootstrap
      Events:
        ListTransactionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/transactions
            Method: GET

  GetTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/transaction/get_transaction
      Handler: bootstrap
      Events:
        GetTransactionApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/transactions/{transaction_id}
            Method: GET

  CreateWalletFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/wallet/create_wallet
      Handler: bootstrap
      Events:
        CreateWalletApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/wallets
            Method: POST

  ListWalletsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/wallet/list_wallets
      Handler: bootstrap
      Events:
        ListWalletsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/wallets
            Method: GET

  GetWalletFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/wallet/get_wallet
      Handler: bootstrap
      Events:
        GetWalletApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/wallets/{wallet_id}
            Method: GET
  
  EditWalletFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: app/lambda/wallet/edit_wallet
      Handler: bootstrap
      Events:
        EditWalletApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SatangLocalHttpApi
            Path: /api/v1.0/wallets/{wallet_id}
            Method: PATCH
